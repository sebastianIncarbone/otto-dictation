name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compilar
        run: dotnet build --configuration Release --nologo

      - name: Testear
        run: dotnet test --configuration Release --nologo --no-build

      # No viene con la imagen del runner. publicar.ps1 falla si no lo encuentra,
      # a proposito: una release que sale sin instalador porque el paso se salteo
      # en silencio es peor que un build roto.
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      # Los dos artefactos se arman en cada push, no solo al etiquetar: un
      # empaquetado que se ejercita una vez por release es un empaquetado que se
      # rompe en silencio.
      #
      # Al etiquetar, la version sale de la etiqueta. Si la aplicacion dijera una
      # version distinta a la publicada, el chequeo de actualizaciones mentiria en
      # silencio para siempre. El instalador toma la suya del ejecutable ya
      # publicado, asi que tampoco puede divergir.
      - name: Empaquetar
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          .\build\publicar.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        with:
          name: Otto-windows-x64
          path: |
            dist/Otto-Setup.exe
            dist/Otto-windows-x64.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Otto-windows-x64

      # Las notas se arman acá y no en el bloque `body` de la accion porque los
      # hashes tienen que salir de los archivos que se estan publicando. Un hash
      # escrito a mano es un hash que en algun momento deja de corresponder al
      # binario, y nadie lo nota porque nadie lo verifica.
      #
      # El link de VirusTotal se arma con el sha256, que es como VirusTotal
      # direcciona los informes. Si el archivo todavia no fue analizado, esa misma
      # URL es donde se lo sube: el link sirve igual y nunca queda pendiente de
      # que alguien se acuerde de pegarlo.
      # SHA256SUMS se publica como archivo adjunto y no solamente adentro del
      # cuerpo de la release, porque ahora tiene dos lectores: una persona que
      # verifica a mano, y Otto actualizandose a si mismo. Sacar el hash del
      # cuerpo obligaria a parsear prosa en espanol, o sea a atar una comprobacion
      # de integridad a la redaccion de un texto que existe para que lo lea gente.
      #
      # Los hashes de las notas salen de este mismo archivo, no de una segunda
      # corrida de sha256sum. Calcularlos dos veces son dos oportunidades de que
      # digan cosas distintas, y el que se publica adentro del .md es justo el que
      # nadie vuelve a comparar.
      - name: Calcular los hashes
        run: |
          sha256sum Otto-Setup.exe Otto-windows-x64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Armar las notas con los hashes
        run: |
          SETUP=$(awk '$2 == "Otto-Setup.exe" { print $1 }' SHA256SUMS)
          ZIP=$(awk '$2 == "Otto-windows-x64.zip" { print $1 }' SHA256SUMS)

          cat > notas.md <<'PLANTILLA'
          ## Instalación

          Bajá **`Otto-Setup.exe`** y ejecutalo. No pide administrador, y te deja
          elegir el acceso directo en el menú Inicio y en el escritorio. Se
          desinstala desde *Agregar o quitar programas*, como cualquier otro
          programa.

          No hace falta instalar .NET ni nada más.

          <details>
          <summary>¿Preferís no instalar nada?</summary>

          `Otto-windows-x64.zip` es la misma aplicación en versión portable:
          descomprimila donde quieras y ejecutá `Otto.App.exe`. Sirve para un
          pendrive o para una máquina donde no podés instalar programas. La
          desinstalación en ese caso la hace Otto desde su configuración.
          </details>

          Windows va a mostrar una advertencia de SmartScreen porque el ejecutable
          no está firmado: **Más información** → **Ejecutar de todas formas**.

          La primera vez baja el modelo de voz. Después funciona sin internet.

          ## Verificación

          El ejecutable no está firmado, así que acá está el análisis y el hash para
          que puedas comprobar que ese análisis es del archivo que bajaste y no de
          otro.

          **Análisis de VirusTotal:**
          [`Otto-Setup.exe`](https://www.virustotal.com/gui/file/__SETUP__) ·
          [`Otto-windows-x64.zip`](https://www.virustotal.com/gui/file/__ZIP__)

          Algunos motores lo van a marcar. No es un error: Otto registra un atajo
          global y sintetiza pulsaciones de teclado, que es funcionalmente la
          descripción de un keylogger. Está publicado con esas marcas a la vista a
          propósito — el código es abierto y se puede leer entero.

          ```
          SHA-256

          __SETUP__  Otto-Setup.exe
          __ZIP__  Otto-windows-x64.zip
          ```

          Para comprobarlo en Windows:

          ```powershell
          Get-FileHash Otto-Setup.exe -Algorithm SHA256
          ```
          PLANTILLA

          sed -i "s/__SETUP__/$SETUP/g; s/__ZIP__/$ZIP/g" notas.md
          cat notas.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Otto-Setup.exe
            Otto-windows-x64.zip
            SHA256SUMS
          body_path: notas.md
